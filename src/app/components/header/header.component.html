<header class="header">
  <div class="container header-bar">
    <a routerLink="/" class="logo" (click)="closeMenu()">
      <img src="/assets/logo.png" alt="" class="logo-image" width="40" height="40">
      <span class="logo-text">DogoSoft <em>FastFood</em></span>
    </a>

    <button
      type="button"
      class="menu-toggle"
      [attr.aria-expanded]="menuOpen"
      aria-controls="site-nav"
      (click)="toggleMenu()">
      <span class="sr-only">Menú</span>
      <span [class.open]="menuOpen"></span>
    </button>

    <nav class="nav" id="site-nav" [class.open]="menuOpen">
      <a routerLink="/" fragment="como-funciona" (click)="closeMenu()">Cómo funciona</a>
      <a routerLink="/" fragment="modulos" (click)="closeMenu()">Módulos</a>
      <a routerLink="/" fragment="carta" (click)="closeMenu()">Carta online</a>
      <a routerLink="/" fragment="planes" (click)="closeMenu()">Planes</a>
      <a routerLink="/" fragment="faq" (click)="closeMenu()">Preguntas</a>
      <a routerLink="/contact" routerLinkActive="active" (click)="closeMenu()">Contacto</a>
      <a class="btn btn-primary nav-cta" routerLink="/contact" [queryParams]="{ intent: 'trial' }" (click)="closeMenu()">{{ site.trialCta }}</a>
    </nav>
  </div>
</header>
