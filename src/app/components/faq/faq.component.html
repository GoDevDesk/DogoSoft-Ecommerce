<div class="faq-container">
  <div class="container">
    <h2 class="page-title">Preguntas Frecuentes</h2>
    <p class="page-subtitle">Encuentra respuestas a las preguntas más comunes sobre nuestros productos y servicios</p>
    
    <div class="faq-list">
      <div 
        class="faq-item" 
        *ngFor="let faq of faqs; let i = index"
        [class.open]="openFaq === i">
        
        <div class="faq-question" (click)="toggleFaq(i)">
          <h3>{{ faq.question }}</h3>
          <span class="faq-icon">{{ openFaq === i ? '−' : '+' }}</span>
        </div>
        
        <div class="faq-answer" [class.show]="openFaq === i">
          <p>{{ faq.answer }}</p>
        </div>
      </div>
    </div>
    
    <div class="faq-footer">
      <p>¿No encontraste la respuesta que buscabas?</p>
      <a routerLink="/contact" class="btn btn-primary">Contáctanos</a>
    </div>
  </div>
</div>
