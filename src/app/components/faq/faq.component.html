<div class="faq-container">
  <div class="container">
    <h2 class="page-title">Preguntas frecuentes</h2>
    <p class="page-subtitle">Prueba gratis, planes, pagos y qué incluye DogoSoft FastFood.</p>

    <div class="faq-list">
      @for (faq of faqs; track faq.question; let i = $index) {
        <div class="faq-item" [class.open]="openFaq === i">
          <button type="button" class="faq-question" (click)="toggleFaq(i)" [attr.aria-expanded]="openFaq === i">
            <h3>{{ faq.question }}</h3>
            <span class="faq-icon" aria-hidden="true">{{ openFaq === i ? '−' : '+' }}</span>
          </button>
          @if (openFaq === i) {
            <div class="faq-answer show">
              <p>{{ faq.answer }}</p>
            </div>
          }
        </div>
      }
    </div>

    <div class="faq-footer">
      <p>¿Todavía tenés dudas sobre el plan o la prueba?</p>
      <a routerLink="/contact" class="btn btn-primary">Escribinos</a>
    </div>
  </div>
</div>
